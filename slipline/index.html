<!DOCTYPE html>
<html lang="en">
<!--
  SLIPLINE (working title, DRAFT) — concept #2, built from the canonical seed harness
  C:/Flint/skills/game-delivery/browser-portal-games/templates/playable-seed.html.
  The harness is intact: fixed logical space, DPR cap 2, fixed timestep, seeded run seed,
  pinned recalculation, the __game probe hook, ad stubs. The REPLACE sections are this game.
  It starts IN PLAY — no click-to-start wall (G1).
-->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>SLIPLINE-loading</title>
<style>
  :root { color-scheme: dark; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; background:#05060f; overflow:hidden; overscroll-behavior:none;
              font-family:system-ui,sans-serif; color:#e8e8f2; }
  #app { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  #stage { position:relative; }
  canvas { display:block; touch-action:none; }
  .overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
             justify-content:center; gap:14px; text-align:center;
             background:radial-gradient(circle at 50% 40%, rgba(30,20,70,.55), rgba(4,4,12,.92)); }
  .overlay.hidden, #hud.hidden, #playui.hidden { display:none; }
  .btn { border:1px solid rgba(160,160,255,.45); background:rgba(90,70,200,.22); color:#eaeaff;
         padding:12px 26px; border-radius:12px; font-weight:600; cursor:pointer; min-width:200px; }
  #hud { position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between;
         padding:12px 20px; font-size:13px; pointer-events:none; font-variant-numeric:tabular-nums; }
  /* the UI STRIP: in-play indicators live BELOW the play area, never over it */
  #playui { position:absolute; bottom:10px; left:50%; transform:translateX(-50%);
            display:flex; gap:22px; font-size:19px; line-height:1; }
  .lane { opacity:.28; color:#eaeaff; }
  .lane.on { opacity:1; color:#8f6cf5; }
  #smoke { position:absolute; width:1px; height:1px; overflow:hidden; opacity:0; }
</style>
</head>
<body>
<div id="app"><div id="stage">
  <canvas id="cv"></canvas>
  <div id="hud" class="hidden"><span id="score">0</span><span id="hull">3</span><span id="best">0</span></div>
  <div id="playui" class="hidden">
    <span class="lane" id="ln0">&#9650;</span><span class="lane on" id="ln1">&#9650;</span><span class="lane" id="ln2">&#9650;</span>
  </div>
  <div class="overlay hidden" id="overScreen">
    <div id="finalScore">0</div>
    <button class="btn" id="btnReward">Watch ad: repair one hull</button>
    <button class="btn" id="btnSkip">No thanks</button>
    <button class="btn" id="btnAgain">Play again</button>
  </div>
  <div id="smoke" data-state="loading"></div>
</div></div>
<script>
"use strict";
(function () {
  // ---- logical space; the canvas is scaled to fit and DPR is capped at 2 ----
  const W = 400, H = 640;
  const PLAY_TOP = 118, PLAY_BOTTOM = 590;   // everything below PLAY_BOTTOM is the reserved UI strip
  const DT = 1 / 240, SUB = 4;               // FIXED timestep — never frame-rate dependent
  const SHIFT_MS = 110;                      // a probe driving the lanes MUST wait longer than this

  // ---- SEEDED RNG — the run seed. NEVER Math.random() for game state. ----
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const urlSeed = new URLSearchParams(location.search).get("seed");
  const SEED = urlSeed !== null ? (parseInt(urlSeed, 10) || 0) : (Date.now() / 86400000 | 0);

  const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  const stage = document.getElementById("stage"), smoke = document.getElementById("smoke");
  const hud = document.getElementById("hud"), playui = document.getElementById("playui");
  const overScreen = document.getElementById("overScreen");
  const elScore = document.getElementById("score"), elBest = document.getElementById("best");
  const elHull = document.getElementById("hull"), elFinal = document.getElementById("finalScore");
  const elLane = [document.getElementById("ln0"), document.getElementById("ln1"), document.getElementById("ln2")];

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  function fit() {
    const s = Math.min(window.innerWidth / W, window.innerHeight / H);
    stage.style.width = Math.round(W * s) + "px";
    stage.style.height = Math.round(H * s) + "px";
    cv.width = Math.round(W * s * dpr); cv.height = Math.round(H * s * dpr);
    cv.style.width = cv.width + "px"; cv.style.height = cv.height + "px";
    ctx.setTransform(dpr * s, 0, 0, dpr * s, 0, 0);
  }
  window.addEventListener("resize", fit); fit();

  // ---- persistence is best-effort: file:// origins can refuse localStorage ----
  const KEY = "slipline.v0";
  const save = (() => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } })();
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} };

  // ==================== GAME ====================
  const LANES = 3, LANE_W = 100;
  const LANE_X = [W / 2 - LANE_W, W / 2, W / 2 + LANE_W];
  const CRAFT_W = 34, CRAFT_H = 34, CRAFT_Y = PLAY_BOTTOM - 78;
  const ROW_H = 22, ROW_GAP = 186;
  const BASE_SPEED = 150, MAX_SPEED = 430;
  const START_HULL = 3;

  let state = "menu", score = 0, tick = 0, pointerX = W / 2;
  let lane = 1, craftX = LANE_X[1], hull = START_HULL, combo = 0, multi = 1;
  let rowsPassed = 0, nextRow = 0, speed = BASE_SPEED, flash = 0, lastShift = -1e9;
  let ents = [];                                       // the rows: the real objects a probe asserts on

  // The row shape at index i is a PURE function of the run seed and i, so the daily challenge is the
  // same file for every player, and a probe reproduces the sequence without playing. Exactly two lanes
  // are blocked, so exactly one is always open — the invariant that makes the game fair.
  function rowPattern(i) {
    const r = mulberry32((SEED + i * 1013) >>> 0);
    const a = Math.floor(r() * LANES);
    let b = Math.floor(r() * LANES);
    if (b === a) b = (b + 1 + Math.floor(r() * 2)) % LANES;
    return a < b ? [a, b] : [b, a];
  }

  function shift(dir) { lane = Math.max(0, Math.min(LANES - 1, lane + dir)); }

  function step(dt) {
    speed = Math.min(MAX_SPEED, BASE_SPEED + rowsPassed * 9);
    // the craft EASES to its lane — visible travel, so the cost of a shift is paid, not teleported
    const tx = LANE_X[lane], d = tx - craftX, maxStep = 660 * dt;
    craftX += Math.abs(d) <= maxStep ? d : Math.sign(d) * maxStep;
    if (flash > 0) flash = Math.max(0, flash - dt);

    if (ents.length === 0 || ents[ents.length - 1].y >= PLAY_TOP + ROW_GAP) {
      ents.push({ index: nextRow++, y: PLAY_TOP, blocked: rowPattern(nextRow - 1), hit: false, scored: false });
    }
    for (const row of ents) row.y += speed * dt;

    for (const row of ents) {
      if (!row.hit && Math.abs(row.y - CRAFT_Y) < (CRAFT_H + ROW_H) / 2) {
        for (const l of row.blocked) {
          if (Math.abs(craftX - LANE_X[l]) < (CRAFT_W + 24) / 2) {
            row.hit = true; hull--; combo = 0; multi = 1; flash = 0.28; break;
          }
        }
      }
      if (!row.scored && row.y > CRAFT_Y + CRAFT_H) {
        row.scored = true;
        if (!row.hit) { rowsPassed++; combo++; multi = 1 + Math.min(4, Math.floor(combo / 4)); score += 10 * multi; }
      }
    }
    ents = ents.filter((r) => r.y < PLAY_BOTTOM + 40);
    if (hull <= 0) {
      hull = 0;
      if (score > (save.best ?? 0)) { save.best = score; persist(); }
      elFinal.textContent = score;
      setState("over");
    }
  }

  function checkEnd() { return hull <= 0; }
  // ==============================================

  // STATE-SCOPED UI IS HIDDEN HERE, not in the render path.
  function setState(s) {
    state = s;
    document.title = "SLIPLINE-" + s.toUpperCase();
    smoke.setAttribute("data-state", s);
    overScreen.classList.toggle("hidden", s !== "over");
    hud.classList.toggle("hidden", s !== "play");
    playui.classList.toggle("hidden", s !== "play");
  }

  function newRun() {
    ents = []; score = 0; tick = 0; pointerX = W / 2;
    lane = 1; craftX = LANE_X[1]; hull = START_HULL; combo = 0; multi = 1;
    rowsPassed = 0; nextRow = 0; speed = BASE_SPEED; flash = 0; lastShift = -1e9;
    elLane.forEach((el, i) => el.classList.toggle("on", i === lane));
    setState("play");
  }

  // ---- ONE input path for mouse and touch, mapped through the canvas rect ----
  function toLogical(clientX) {
    const r = cv.getBoundingClientRect();
    return (clientX - r.left) * (W / r.width);
  }
  function onMove(clientX) {
    pointerX = Math.max(0, Math.min(W, toLogical(clientX)));
  }
  function act() {
    if (state !== "play") return;                        // CONTROL: a tap on the end screen moves nothing
    const now = performance.now();
    if (now - lastShift < SHIFT_MS) return;              // a probe MUST wait longer than SHIFT_MS
    lastShift = now;
    shift(pointerX < W / 2 ? -1 : 1);
    elLane.forEach((el, i) => el.classList.toggle("on", i === lane));
  }
  cv.addEventListener("mousemove", (e) => onMove(e.clientX));
  cv.addEventListener("mousedown", (e) => { onMove(e.clientX); act(); });
  cv.addEventListener("touchstart", (e) => { e.preventDefault(); onMove(e.touches[0].clientX); }, { passive: false });
  cv.addEventListener("touchmove",  (e) => { e.preventDefault(); onMove(e.touches[0].clientX); }, { passive: false });
  cv.addEventListener("touchend",   (e) => { e.preventDefault(); act(); }, { passive: false });

  // ---- ad call sites exist at v0 as STUBS; the portal SDK replaces these bodies later ----
  const requestMidgame = () => console.log("[ads] midgame requested (stub)");
  const requestReward  = () => console.log("[ads] rewarded requested (stub)");

  document.getElementById("btnAgain").addEventListener("click", () => { requestMidgame(); newRun(); });
  document.getElementById("btnReward").addEventListener("click", requestReward);
  document.getElementById("btnSkip").addEventListener("click", () => {});   // equal weight to the ad button

  function render() {
    ctx.fillStyle = "#05060f"; ctx.fillRect(0, 0, W, H);
    // lane guides
    ctx.strokeStyle = "rgba(120,120,190,.16)"; ctx.lineWidth = 1;
    for (let i = 0; i < LANES; i++) {
      const x = LANE_X[i];
      ctx.beginPath(); ctx.moveTo(x - LANE_W / 2, PLAY_TOP); ctx.lineTo(x - LANE_W / 2, PLAY_BOTTOM); ctx.stroke();
    }
    ctx.beginPath(); ctx.moveTo(W - LANE_W / 2, PLAY_TOP); ctx.lineTo(W - LANE_W / 2, PLAY_BOTTOM); ctx.stroke();

    for (const row of ents) {
      for (let i = 0; i < LANES; i++) {
        if (row.blocked.indexOf(i) === -1) continue;
        const x = LANE_X[i] - LANE_W / 2 + 8;
        ctx.fillStyle = row.hit ? "#5a3350" : "#343a5c";
        ctx.fillRect(x, row.y - ROW_H / 2, LANE_W - 16, ROW_H);
      }
    }

    // the craft, tilted by how far it still has to travel
    const tilt = Math.max(-1, Math.min(1, (LANE_X[lane] - craftX) / 40)) * 0.3;
    ctx.save();
    ctx.translate(craftX, CRAFT_Y); ctx.rotate(tilt);
    ctx.fillStyle = flash > 0 ? "#ff7a7a" : "#8f6cf5";
    ctx.beginPath();
    ctx.moveTo(0, -CRAFT_H / 2); ctx.lineTo(CRAFT_W / 2, CRAFT_H / 2);
    ctx.lineTo(0, CRAFT_H / 2 - 8); ctx.lineTo(-CRAFT_W / 2, CRAFT_H / 2);
    ctx.closePath(); ctx.fill();
    ctx.restore();

    if (flash > 0) { ctx.fillStyle = "rgba(220,60,60," + (flash * 0.5) + ")"; ctx.fillRect(0, 0, W, H); }

    if (state === "play") {
      elScore.textContent = score;
      elBest.textContent = save.best ?? 0;
      elHull.textContent = hull;
    }
  }

  let acc = 0, last = performance.now();
  function frame(now) {
    const real = Math.min((now - last) / 1000, 0.05); last = now;
    if (state === "play") {
      acc += real;
      let n = 0;
      while (acc >= DT && n < 12) {
        for (let i = 0; i < SUB; i++) step(DT / SUB);
        tick++;
        if (checkEnd()) { acc = 0; break; }
        acc -= DT; n++;
      }
    }
    render();
    requestAnimationFrame(frame);
  }

  // ---- the probe surface: expose the REAL objects, not the drawing ----
  window.__game = {
    debug: () => ({ state, score, ents: ents.length, dpr, best: save.best ?? 0, seed: SEED, tick,
                    lane, hull, combo, multi, rowsPassed, speed: Math.round(speed), craftX: Math.round(craftX) }),
    newRun, act, shift, setPointer: onMove,
    get seed() { return SEED; },
    get tick() { return tick; },
    shape: (i) => rowPattern(i),          // pure seed->row shape, for determinism assertions
    _ents: () => ents
  };

  newRun();                                // starts IN PLAY — G1, no click-to-start wall
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
