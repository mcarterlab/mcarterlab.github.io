<!DOCTYPE html>
<html lang="en">
<!--
  TURNSLIP — game #4 of the CrazyGames factory. Single file, zero deps, no server.
  Built on the shape of skills/game-delivery/browser-portal-games/templates/playable-seed.html:
  fixed logical space, fixed timestep, one pointerdown path, seeded RNG + daily seed,
  #smoke state and a __game probe surface. Logic replaced, harness kept.
  Slice 2 (polish): presentation + audio pass. The game core — RNG, rotation, wall step,
  ball fall, solver, generation — is byte-for-byte the slice-1 logic.
  Slice 3 (UI): the HUD, board caption, turn-budget pips, tap zone, over-screen and
  tutorial are DOM, scaled to the stage with one --s factor and safe-area aware, so the
  layout reads identically on a wide desktop and a phone in portrait. The canvas keeps
  only the game itself; all text is DOM so nothing is blurry at any DPR. The canvas CSS
  size is fixed to the logical box (hi-DPI bug from slice 2 corrected). No mechanic
  added or changed.
  SPEC: turnslip/SPEC.md  ·  CONCEPT: turnslip/CONCEPT.md
-->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>TURNSLIP</title>
<style>
  :root { color-scheme: dark; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; background:#05060f; overflow:hidden; overscroll-behavior:none;
              font-family:system-ui,sans-serif; color:#e8e8f2; user-select:none; -webkit-user-select:none; }
  #app { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  /* --s is the live css-px-per-logical-px scale, set by fit() on every resize.
     Every UI size below is a multiple of it, so the layout reads identically at 400x640
     and at 2560x1080; text is DOM, so it is crisp at any devicePixelRatio. */
  #stage { position:relative; --s:1; }
  canvas { display:block; touch-action:none; }
  .hidden { display:none !important; }

  /* soft vignette above the canvas, below the UI */
  #vig { position:absolute; inset:0; z-index:1; pointer-events:none;
         background:radial-gradient(130% 95% at 50% 42%, rgba(0,0,0,0) 58%, rgba(2,3,10,.55) 100%); }

  /* ---- HUD: the three stats centred, the meta line full-width under them ---- */
  #hud { position:absolute; top:0; left:0; right:0; z-index:3; pointer-events:none;
         padding:calc(env(safe-area-inset-top, 0px) + 8px * var(--s)) calc(16px * var(--s)) 0; }
  #hud .stats { display:flex; justify-content:center; gap:calc(30px * var(--s)); }
  #hud .stat { display:flex; flex-direction:column; align-items:center; gap:calc(3px * var(--s)); }
  #hud .stat span { font-size:calc(9px * var(--s)); letter-spacing:.22em; opacity:.5; }
  #hud .stat b { font-size:calc(22px * var(--s)); font-weight:650; line-height:1;
                 font-variant-numeric:tabular-nums; }
  #hud .meta { display:flex; justify-content:space-between; align-items:center;
               margin-top:calc(9px * var(--s)); }
  #hud .brand { font-size:calc(9px * var(--s)); letter-spacing:.34em; opacity:.34; }
  #hud .seedtag { font-size:calc(9px * var(--s)); letter-spacing:.18em; opacity:.4;
                  font-variant-numeric:tabular-nums; }
  #hud .mute { pointer-events:auto; cursor:pointer; font-size:calc(10px * var(--s)); letter-spacing:.14em;
               opacity:.55; border:calc(1px * var(--s)) solid rgba(150,170,255,.28);
               border-radius:calc(8px * var(--s));
               padding:calc(5px * var(--s)) calc(10px * var(--s)); }
  #hud .mute:active { opacity:1; background:rgba(126,242,255,.08); }

  /* ---- board caption (BOARD N · BEST x TURNS) ---- */
  #boardCap { position:absolute; left:0; right:0; top:calc(74px * var(--s)); z-index:3; text-align:center;
              font-size:calc(10px * var(--s)); letter-spacing:.3em; opacity:.55; pointer-events:none;
              font-variant-numeric:tabular-nums; white-space:nowrap; }

  /* ---- turn-budget pips, centred in the strip just under the board frame ---- */
  #pips { position:absolute; left:0; right:0; top:calc(470px * var(--s)); z-index:3; pointer-events:none;
          display:flex; justify-content:center; gap:calc(6px * var(--s)); }
  #pips .pip { width:calc(16px * var(--s)); height:calc(9px * var(--s)); border-radius:calc(3px * var(--s));
               background:rgba(255,255,255,.10); }
  #pips .pip.on { background:#7ef2ff; }
  #pips .pip.on.warn { background:#ff7b7b; }

  /* ---- tap zone: the whole bottom strip, two equal halves, one real input path ---- */
  #tap { position:absolute; left:0; right:0; top:calc(496px * var(--s)); height:calc(144px * var(--s));
         display:flex; z-index:2; }
  #tap .tz { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
             gap:calc(7px * var(--s)); transition:background .22s ease-out; }
  #tap .tz.chip { background:rgba(126,242,255,.13); }
  #tap #tza { border-right:calc(1px * var(--s)) solid rgba(150,170,255,.10); }
  #tap .chev { font-size:calc(50px * var(--s)); font-weight:300; line-height:1;
               color:rgba(126,242,255,.55); transition:opacity .12s ease-out; }
  #tap .tag { font-size:calc(10px * var(--s)); letter-spacing:.3em; opacity:.4; }

  /* ---- over screen ---- */
  .overlay { position:absolute; inset:0; z-index:4; display:flex; flex-direction:column; align-items:center;
             justify-content:center; gap:calc(11px * var(--s)); text-align:center; pointer-events:none;
             background:rgba(4,4,14,.88); backdrop-filter:blur(3px); }
  #overScreen .sub { font-size:calc(11px * var(--s)); opacity:.72; letter-spacing:.3em; }
  #overScreen h1 { font-size:calc(64px * var(--s)); font-weight:700; line-height:1;
                   font-variant-numeric:tabular-nums; }
  #overScreen .row { display:flex; gap:calc(12px * var(--s)); align-items:center; flex-wrap:wrap;
                     justify-content:center; max-width:86%; }
  #overScreen .badge { font-size:calc(10px * var(--s)); letter-spacing:.16em; opacity:.78;
                       border:calc(1px * var(--s)) solid rgba(150,170,255,.25);
                       border-radius:calc(8px * var(--s));
                       padding:calc(5px * var(--s)) calc(10px * var(--s)); }
  #overScreen .badge b { font-weight:650; font-variant-numeric:tabular-nums; }
  #overScreen .newbest { background:rgba(255,179,71,.10); border-color:rgba(255,179,71,.45); opacity:1; }
  #overScreen .music-line { margin-top:calc(2px * var(--s)); font-size:calc(9px * var(--s));
                            letter-spacing:.22em; opacity:.42; text-transform:uppercase; }
  #overScreen .hint { margin-top:calc(6px * var(--s)); font-size:calc(11px * var(--s));
                      letter-spacing:.24em; opacity:.6; animation:blink 1.4s infinite; }

  /* ---- tutorial card: two lines, bottom-pinned, clear of the ball and the chevrons ---- */
  #tutorial { position:absolute; left:calc(12px * var(--s)); right:calc(12px * var(--s));
              bottom:calc(10px * var(--s)); z-index:3; display:flex; flex-direction:column;
              align-items:center; gap:calc(3px * var(--s));
              padding:calc(10px * var(--s)) calc(14px * var(--s));
              background:rgba(8,12,32,.90); border:calc(1px * var(--s)) solid #2a3468;
              border-radius:calc(10px * var(--s));
              font-size:calc(11px * var(--s)); line-height:1.5; letter-spacing:.04em; color:#d6dcff;
              pointer-events:none; animation:tutfade .4s ease-out; }
  #tutorial .arrow { font-size:calc(14px * var(--s)); vertical-align:-2px; animation:blink 1.2s infinite; }
  @keyframes tutfade { from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }
  @keyframes blink { 0%,100%{opacity:.25} 50%{opacity:.85} }

  #smoke { position:absolute; width:1px; height:1px; overflow:hidden; opacity:0; }
</style>
</head>
<body>
<div id="app"><div id="stage">
  <canvas id="cv"></canvas>
  <div id="vig"></div>
  <div id="hud" class="hidden">
    <div class="stats">
      <div class="stat"><span>DEPTH</span><b id="depth">0</b></div>
      <div class="stat"><span>TURNS</span><b id="turns">0</b></div>
      <div class="stat"><span>BEST</span><b id="best">0</b></div>
    </div>
    <div class="meta">
      <span class="brand">TURNSLIP</span>
      <span class="seedtag" id="seedTag"></span>
      <span class="mute" id="mute">&#9835; ON</span>
    </div>
  </div>
  <div id="boardCap" class="hidden"></div>
  <div id="pips" class="hidden"></div>
  <div id="tap" class="hidden">
    <div class="tz" id="tza"><span class="chev" id="chevL">&#8249;</span><span class="tag">TURN LEFT</span></div>
    <div class="tz" id="tzb"><span class="chev" id="chevR">&#8250;</span><span class="tag">TURN RIGHT</span></div>
  </div>
  <div class="overlay hidden" id="overScreen">
    <div class="sub">RUN OVER</div>
    <h1 id="finalDepth">0</h1>
    <div class="sub">BOARDS CLEARED</div>
    <div class="row">
      <span class="badge">BEST <b id="finalBest">0</b></span>
      <span class="badge">TURNS <b id="finalTurns">0</b></span>
      <span class="badge newbest hidden" id="newBest">NEW BEST</span>
    </div>
    <div class="music-line" id="musicLine">MUSIC — — — —</div>
    <div class="hint">TAP TO PLAY AGAIN</div>
  </div>
  <div id="tutorial" class="hidden">
    <span><span class="arrow">&#8249; &#8250;</span>&nbsp;&nbsp;TAP A SIDE TO SPIN THE BOARD</span>
    <span>REACH THE HOLE DRAIN — WALLS LOOSEN EVERY TURN</span>
  </div>
  <div id="smoke" data-state="loading"></div>
</div></div>
<script>
/* Minstrel — procedural music in WebAudio. No samples, no assets, seeded.
 *
 * Musical rules (this is what stops it sounding random):
 *   - PULSE: kick/snare/hat on a 16th grid, snare on 2 and 4, swung hats.
 *   - MOTIF: a melody is 5-7 notes whose INTERVALS are fixed for the phrase.
 *     An 8-bar period restates it: A (bars 1-2), A up a third (3-4),
 *     A down a step (5-6), cadence (7-8, half as busy, ending on the root).
 *     Players latch onto the repeated shape, not the individual notes.
 *   - KEY, not chord, for melody: the line stays in the key while the chords
 *     move underneath; strong beats snap to the chord's triad tones.
 *   - SPACE: stereo voices, long attack pads, two-tap reverb, roomy release.
 *   - VARIETY: the seed picks progression, palette, groove, register, period
 *     and octave, so two seeds are two different pieces of music.
 *
 * API: new Minstrel({seed,tempo,scale,root,prog,volume,groove,swing,space});
 *      start(); stop(); setVolume(v); Minstrel.describe(seed) -> what a seed picked
 */
(function (global) {
  'use strict';

  function rng(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var SCALES = {
    major:      [0, 2, 4, 5, 7, 9, 11],
    minor:      [0, 2, 3, 5, 7, 8, 10],
    dorian:     [0, 2, 3, 5, 7, 9, 10],
    mixolydian: [0, 2, 4, 5, 7, 9, 10],
    penta:      [0, 2, 4, 7, 9]
  };

  var PROGS = [
    [0, 5, 3, 4], [0, 3, 4, 4], [5, 3, 0, 4], [0, 4, 5, 3],
    [0, 5, 6, 4], [3, 4, 0, 0], [0, 2, 5, 4]
  ];

  var GROOVES = {
    none:     { kick: [],            snare: [],      hat: 0, bass: [[0, 0], [8, 0]] },
    straight: { kick: [0, 8],        snare: [4, 12], hat: 2, bass: [[0, 0], [6, 0], [8, 0], [14, 4]] },
    four:     { kick: [0, 4, 8, 12], snare: [4, 12], hat: 2, bass: [[0, 0], [2, 0], [4, 4], [8, 0], [10, 0], [14, 4]] },
    half:     { kick: [0, 10],       snare: [8],     hat: 2, bass: [[0, 0], [6, 0], [8, 4], [10, 0]] },
    broken:   { kick: [0, 3, 8, 11], snare: [4, 12], hat: 1, bass: [[0, 0], [3, 0], [6, 4], [8, 0], [11, 0], [14, 4]] },
    shuffle:  { kick: [0, 6, 10],    snare: [4, 12], hat: 2, bass: [[0, 0], [6, 4], [10, 0]] }
  };

  var PALETTES = {
    deep:  { pad: 'sawtooth', padG: 0.040, padC: 700,  mel: 'triangle', melG: 0.075, melC: 3200, bass: 'triangle', bassC: 360, hat: 0.26, kick: 0.95, detune: 7 },
    glass: { pad: 'triangle', padG: 0.055, padC: 1500, mel: 'sine',     melG: 0.100, melC: 6000, bass: 'sine',     bassC: 300, hat: 0.20, kick: 0.85, detune: 13 },
    chip:  { pad: 'square',   padG: 0.028, padC: 900,  mel: 'square',   melG: 0.052, melC: 4500, bass: 'square',   bassC: 420, hat: 0.22, kick: 0.90, detune: 4 },
    warm:  { pad: 'sawtooth', padG: 0.045, padC: 600,  mel: 'triangle', melG: 0.080, melC: 2400, bass: 'triangle', bassC: 340, hat: 0.18, kick: 1.00, detune: 10 }
  };

  /* 2-bar rhythmic motifs, in beats (0-8): long values, real rests, no twitch */
  var RHYTHMS = [
    [0, 1, 2, 3.5, 4, 6],
    [0, 1.5, 2, 4, 5, 6.5],
    [0, 2, 3, 4, 6],
    [0, 1, 2.5, 4, 5.5, 7],
    [0, 1.5, 3, 4.5, 6, 7.5]
  ];
  var SHIFTS = [0, 2, -1, -3];      // A, A up a third, A down a step, cadence

  var mtof = function (m) { return 440 * Math.pow(2, (m - 69) / 12); };

  var LOOKAHEAD = 2.2;      // seconds of music kept scheduled in advance
  var PAD_OVERLAP = 0.6;    // pad runs this far past the bar line, then crossfades

  function Minstrel(opts) {
    opts = opts || {};
    this.ctx = null;
    this.seed = opts.seed || 1;
    var sr = rng(this.seed * 2246822519 + 7);      // seed decides the character

    this.tempo = opts.tempo || 96;
    this.scaleName = SCALES[opts.scale] ? opts.scale : 'dorian';
    this.scale = SCALES[this.scaleName];
    this.root = opts.root || 57;
    this.progIndex = (opts.prog == null || opts.prog === 'auto')
      ? Math.floor(sr() * PROGS.length) : (opts.prog % PROGS.length);
    this.prog = PROGS[this.progIndex];
    this.grooveName = (opts.groove == null || opts.groove === 'auto')
      ? ['broken', 'straight', 'four', 'half', 'shuffle'][Math.floor(sr() * 5)]
      : (GROOVES[opts.groove] ? opts.groove : 'broken');
    this.groove = GROOVES[this.grooveName];
    this.paletteName = PALETTES[opts.palette] ? opts.palette
      : ['deep', 'glass', 'warm', 'chip'][Math.floor(sr() * 4)];
    this.pal = PALETTES[this.paletteName];
    this.octave = sr() < 0.5 ? 0 : 12;              // melody register
    this.swing = opts.swing == null ? 0.35 : opts.swing;
    this.space = opts.space == null ? 0.45 : opts.space;
    this.volume = opts.volume == null ? 1.0 : opts.volume;
    this.playing = false;
    this.bar = 0;
    this.notes = 0;
    this.nextTime = 0;
    this.bars = [];
    this._timer = null;
    this._voices = [];
    this._phrase = null;
    this._padUntil = 0;
    this.onnote = null;
  }

  /* ---------- output chain: stereo, two-tap reverb, sidechain bus ---------- */
  Minstrel.prototype._build = function () {
    var ctx = this.ctx, sp = this.space;
    this.master = ctx.createGain();
    this.master.gain.value = this.volume;
    var comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -18; comp.knee.value = 8; comp.ratio.value = 5;
    comp.attack.value = 0.006; comp.release.value = 0.3;
    this.master.connect(comp); comp.connect(ctx.destination);

    this.padBus = ctx.createGain();
    this.padBus.gain.value = 1;
    this.padBus.connect(this.master);

    this.drumBus = ctx.createGain();
    this.drumBus.gain.value = 0.85;
    this.drumBus.connect(this.master);

    // reverb: two delay taps through one lowpass, feedback rising with space
    var wet = ctx.createGain();
    wet.gain.value = 0.16 + 0.34 * sp;
    wet.connect(ctx.destination);
    var hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 220;
    hp.connect(wet);
    [[0.19 + 0.11 * sp, 0.22 + 0.16 * sp], [0.37 + 0.23 * sp, 0.18 + 0.12 * sp]]
      .forEach(function (t) {
        var d = ctx.createDelay(2.0), fb = ctx.createGain(), lp = ctx.createBiquadFilter();
        d.delayTime.value = t[0];
        fb.gain.value = t[1];
        lp.type = 'lowpass'; lp.frequency.value = 1600 + 1200 * sp;
        d.connect(lp); lp.connect(fb); fb.connect(d); lp.connect(hp);
        this.master.connect(d);
      }, this);
    return ctx;
  };

  Minstrel.prototype.init = function () {
    if (this.ctx) return this.ctx;
    var AC = global.AudioContext || global.webkitAudioContext;
    this.ctx = new AC();
    return this._build();
  };

  /* ---------- one pitched voice: attack, sustain, then release ---------- */
  Minstrel.prototype._note = function (t, midi, dur, type, gain, cutoff, attack, voice, pan) {
    var ctx = this.ctx, pal = this.pal;
    var o = ctx.createOscillator();
    var o2 = voice === 'pad' ? ctx.createOscillator() : null;   // detuned pair = width
    var g = ctx.createGain();
    var f = ctx.createBiquadFilter();
    var a = attack || 0.012;
    var rel = 0.3 + 0.8 * this.space;
    f.type = 'lowpass'; f.frequency.value = cutoff || 1800; f.Q.value = 0.5;
    o.type = type; o.frequency.value = mtof(midi);
    if (o2) {
      o2.type = type;
      o2.frequency.value = mtof(midi) * (1 + pal.detune / 10000);
      o2.connect(f);
      o2.start(t); o2.stop(t + dur + rel + 0.05);
    }
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(gain, t + a);
    g.gain.setValueAtTime(gain, t + Math.max(a + 0.01, dur));
    g.gain.exponentialRampToValueAtTime(0.0004, t + dur + rel);
    o.connect(f); f.connect(g);
    if (ctx.createStereoPanner && pan) {
      var p = ctx.createStereoPanner();
      p.pan.value = pan;
      g.connect(p); p.connect(voice === 'pad' ? this.padBus : this.master);
    } else {
      g.connect(voice === 'pad' ? this.padBus : this.master);
    }
    o.start(t); o.stop(t + dur + rel + 0.05);

    var self = this, rec = { o: o, o2: o2, t: t, end: t + dur + rel, midi: midi };
    this._voices.push(rec);
    o.onended = function () {
      var i = self._voices.indexOf(rec);
      if (i >= 0) self._voices.splice(i, 1);
    };
    this.notes++;
    if (this.onnote) this.onnote(rec, midi, dur, voice || type);
  };

  /* ---------- drums, synthesised ---------- */
  Minstrel.prototype._noiseBuf = function () {
    if (this._nb) return this._nb;
    var len = Math.floor(this.ctx.sampleRate * 0.5);
    var b = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    var d = b.getChannelData(0), r = rng((this.seed ^ 0x9e3779b9) >>> 0);
    for (var i = 0; i < len; i++) d[i] = r() * 2 - 1;
    this._nb = b;
    return b;
  };

  Minstrel.prototype._drum = function (t, kind, gain) {
    var ctx = this.ctx, o, g, f, n, ng, nf, len, panner;
    var self = this;
    function out(node, pan) {
      if (ctx.createStereoPanner && pan) { panner = ctx.createStereoPanner(); panner.pan.value = pan; node.connect(panner); panner.connect(self.drumBus); }
      else node.connect(self.drumBus);
    }
    if (kind === 'kick') {
      o = ctx.createOscillator(); g = ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(155, t);
      o.frequency.exponentialRampToValueAtTime(45, t + 0.1);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(gain * this.pal.kick, t + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0005, t + 0.33);
      o.connect(g); out(g, 0);
      o.start(t); o.stop(t + 0.36);
      if (this.padBus) {                       // duck the pad: the pump you feel
        var pg = this.padBus.gain;
        pg.linearRampToValueAtTime(0.55, t + 0.02);
        pg.linearRampToValueAtTime(1, t + 0.22);
      }
      return;
    }
    n = ctx.createBufferSource(); n.buffer = this._noiseBuf();
    ng = ctx.createGain(); nf = ctx.createBiquadFilter();
    if (kind === 'snare') {
      nf.type = 'bandpass'; nf.frequency.value = 1900; nf.Q.value = 0.8;
      ng.gain.setValueAtTime(0.0001, t);
      ng.gain.linearRampToValueAtTime(gain, t + 0.002);
      ng.gain.exponentialRampToValueAtTime(0.0005, t + 0.16);
      n.connect(nf); nf.connect(ng); out(ng, -0.3);
      n.start(t); n.stop(t + 0.2);
      o = ctx.createOscillator(); g = ctx.createGain();
      o.type = 'triangle'; o.frequency.value = 185;
      g.gain.setValueAtTime(gain * 0.5, t);
      g.gain.exponentialRampToValueAtTime(0.0005, t + 0.09);
      o.connect(g); out(g, 0);
      o.start(t); o.stop(t + 0.12);
      return;
    }
    nf.type = 'highpass'; nf.frequency.value = 7200;
    len = kind === 'ohat' ? 0.22 : 0.05;
    ng.gain.setValueAtTime(0.0001, t);
    ng.gain.linearRampToValueAtTime(gain, t + 0.001);
    ng.gain.exponentialRampToValueAtTime(0.0005, t + len);
    n.connect(nf); nf.connect(ng); out(ng, 0.45);
    n.start(t); n.stop(t + len + 0.02);
  };

  /* ---------- harmony ---------- */
  Minstrel.prototype._midiAt = function (deg) {
    var n = this.scale.length;
    var o = Math.floor(deg / n);
    var i = deg - o * n;
    return this.root + this.scale[i] + 12 * o;
  };

  Minstrel.prototype._swingAt = function (i, beat) {   // delay off-beat eighths
    if (i % 4 === 2) return this.swing * beat / 6;
    if (i % 2 === 1) return this.swing * beat / 12;
    return 0;
  };

  /* One motif, developed over 8 bars. Events are in the KEY (degree indices),

  function capture() {
    const s = live, stones = [];
    for (let r = 0; r < s.N; r++) for (let c = 0; c < s.N; c++) if (s.stone[r * s.N + c]) stones.push({ r, c });
    return {
      stones, drain: { r: s.drain.r, c: s.drain.c }, ball: { r: s.ball.r, c: s.ball.c },
      walls: s.walls.map((w) => ({ id: w.id, r: w.r, c: w.c }))
    };
  }
  const CT = (N, r, c) => ({ x: c + 0.5, y: r + 0.5 });          // cell centre, in cell units
  function midPoint(N, dir, from) {                              // rotate a cell-centre about the board centre
    const m = N / 2, dx = from.x - m, dy = from.y - m;
    return dir > 0 ? { x: m - dy, y: m + dx } : { x: m + dy, y: m - dx };
  }

  function turn(dir) {
    if (state !== "play" || anim > 0 || pending) return false;
    const s = live, N = s.N;
    const prev = capture();

    rotState(s, dir);
    wallsStep(s);
    const sunk = ballFall(s);

    rot = (rot + dir + 4) % 4;
    turnsLeft--;
    flashT = 0.22; flashDir = dir;

    const items = [];
    for (let i = 0; i < prev.stones.length; i++) {
      const f = CT(N, prev.stones[i].r, prev.stones[i].c), m = midPoint(N, dir, f);
      items.push({ kind: "stone", from: f, mid: m, to: m, gone: false });
    }
    {
      const f = CT(N, prev.drain.r, prev.drain.c), m = midPoint(N, dir, f);
      items.push({ kind: "drain", from: f, mid: m, to: m, gone: false });
    }
    for (let i = 0; i < prev.walls.length; i++) {
      const pw = prev.walls[i];
      let w = null;
      for (let k = 0; k < s.walls.length; k++) if (s.walls[k].id === pw.id) { w = s.walls[k]; break; }
      const f = CT(N, pw.r, pw.c), m = midPoint(N, dir, f);
      items.push({
        kind: "wall", from: f, mid: m,
        to: w ? CT(N, w.r, w.c) : CT(N, s.drain.r, s.drain.c), gone: !w
      });
    }
    {
      const f = CT(N, prev.ball.r, prev.ball.c), m = midPoint(N, dir, f);
      items.push({
        kind: "ball", from: f, mid: m,
        to: sunk ? CT(N, s.drain.r, s.drain.c) : CT(N, s.ball.r, s.ball.c), gone: sunk
      });
    }
    animData = { items, N, dir };
    anim = ANIM;

    // presentation beat: the turn lands
    sfxTurn(dir);
    shakeT = 0.12;
    spawnRing(W / 2, BY + BOARD / 2, BOARD * 0.42, "turn");
    // slice 3: the tapped half of the zone flashes (DOM, not canvas)
    const z = dir > 0 ? document.getElementById("tzb") : document.getElementById("tza");
    z.classList.add("chip");
    setTimeout(function () { z.classList.remove("chip"); }, 240);

    if (sunk) {
      pending = "win"; winT = 0.45;
      sfxWin(); shakeT = 0.30;
      const bp = cellPos(s, s.drain.r, s.drain.c);
      spawnRing(bp.x, bp.y, 8, "drain");
    }
    else if (turnsLeft <= 0) {
      pending = "lose"; deadT = 0.45;
      sfxLose();
      const bp = cellPos(s, s.ball.r, s.ball.c);
      spawnRing(bp.x, bp.y, 8, "lose");
    }
    return true;
  }

  function resolvePending() {
    if (!pending) return;
    const p = pending; pending = null; animData = null;
    if (p === "win") {
      runTurns += budget - turnsLeft;
      const used = budget - turnsLeft, key = SEED + ":" + depth;
      if (!(key in save.bestTurns) || used < save.bestTurns[key]) { save.bestTurns[key] = used; persist(); }
      depth++;
      if (depth > save.bestDepth) { save.bestDepth = depth; persist(); }
      sfxDeal();
      newBoard(depth);
    } else {
      runTurns += budget - turnsLeft;
      if (depth > save.bestDepth) { save.bestDepth = depth; persist(); }
      elFinal.textContent = String(depth);
      elFinalBest.textContent = String(save.bestDepth);
      elFinalTurns.textContent = String(runTurns);
      newBestEl.classList.toggle("hidden", !(depth > 0 && depth > runStartBest));
      if (window.Minstrel) {
        const d = window.Minstrel.describe(MUS_SEED);
        elMusic.textContent = "MUSIC — " + d.groove + " · " + d.palette + " · seed " + MUS_SEED;
      }
      setState("over");
    }
  }

  // ---------- ONE input path for mouse and touch, mapped through the canvas rect ----------
  function onPointer(clientX) {
    if (state === "over") { newRun(); return; }
    if (state !== "play") return;
    const r = cv.getBoundingClientRect();
    const lx = (clientX - r.left) * (W / r.width);
    turn(lx < W / 2 ? -1 : 1);
  }
  function onKey(dir) {
    if (state === "over") { newRun(); return; }
    if (state === "play") turn(dir);
  }
  stage.addEventListener("pointerdown", (e) => { e.preventDefault(); ensureAudio(); onPointer(e.clientX); }, { passive: false });
  window.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft") { e.preventDefault(); ensureAudio(); onKey(-1); }
    else if (e.key === "ArrowRight") { e.preventDefault(); ensureAudio(); onKey(1); }
  });

  // ---------- slice 2: audio — Minstrel (inlined above) + a small SFX layer ----------
  let AC = null;
  function ac() {
    if (!AC) {
      try { AC = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { AC = null; }
    }
    if (AC && AC.state === "suspended" && AC.resume) { const p = AC.resume(); if (p && p.catch) p.catch(() => {}); }
    return AC;
  }
  const audio = { music: null, muted: !!save.muted, vol: 0.9 };
  // the day seed decides the music too: one of 16 Minstrel characters per day.
  const MUS_SEED = ((Math.abs(SEED) % 16) + 16) % 16 + 1;
  function initAudio() {
    if (audio.music) return;
    const c = ac();
    if (!c || !window.Minstrel) return;
    const m = new window.Minstrel({ seed: MUS_SEED, tempo: 93, volume: audio.muted ? 0 : audio.vol });
    m.ctx = c; m._build();          // the constructor ignores opts.ctx; share one AudioContext with the SFX layer
    m.onnote = (rec, midi, dur, voice) => {
      // drums bypass onnote; only pitched voices report, carrying their voice in `voice`
      if (voice === "mel" || voice === "bass") notePulse = 1;
      if (voice === "mel") kickPulse = 0.5;      // chevron nudge on the strong line
    };
    audio.music = m;
  }
  function ensureAudio() {
    initAudio();
    if (audio.music && !audio.music.playing) audio.music.start();
  }
  function toggleMute() {
    audio.muted = !audio.muted;
    save.muted = audio.muted ? 1 : 0; persist();
    if (audio.music) audio.music.setVolume(audio.muted ? 0 : audio.vol);
    muteEl.textContent = audio.muted ? "♪ OFF" : "♪ ON";
  }
  muteEl.addEventListener("pointerdown", (e) => { e.stopPropagation(); toggleMute(); }, { passive: false });

  // tiny synthesized cues — the SFX layer the Minstrel leaves to the game
  function blip(f0, f1, dur, type, g) {
    if (audio.muted) return;
    const c = ac(); if (!c) return;
    const o = c.createOscillator(), v = c.createGain();
    o.type = type || "sine";
    const t0 = c.currentTime + 0.001;
    o.frequency.setValueAtTime(f0, t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
    v.gain.setValueAtTime(g || 0.16, t0);
    v.gain.exponentialRampToValueAtTime(0.0005, t0 + dur);
    o.connect(v); v.connect(c.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  function sfxTurn(dir) { blip(dir > 0 ? 340 : 280, dir > 0 ? 620 : 480, 0.08, "triangle", 0.10); }
  function sfxDeal() { blip(392, 784, 0.16, "sine", 0.14); setTimeout(function () { blip(587.33, 1174.66, 0.14, "sine", 0.10); }, 85); }
  function sfxWin() {
    [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) {
      setTimeout(function () { blip(f, f * 1.01, 0.16, "triangle", 0.12); }, i * 75);
    });
  }
  function sfxLose() { blip(150, 55, 0.30, "sine", 0.20); }

  // ---------- slice 2: particles (presentation only, capped, never game state) ----------
  function spawnRing(x, y, R, kind) {
    const n = kind === "drain" ? 16 : kind === "lose" ? 12 : kind === "turn" ? 14 : 10;
    const sp = kind === "drain" ? 220 : kind === "lose" ? 170 : 150;
    const col = kind === "drain" ? "#ffb347" : kind === "lose" ? "#ff7b7b" : "#7ef2ff";
    for (let i = 0; i < n && parts.length < 90; i++) {
      const a = (i / n) * 6.2832 + (i * 37 % 13) * 0.046;
      parts.push({
        x: x + Math.cos(a) * R, y: y + Math.sin(a) * R,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        t: 0.5, T: 0.5, r: kind === "drain" ? 2.4 : 2, c: col
      });
    }
  }
  function drawParts() {
    for (let i = 0; i < parts.length; i++) {
      const p = parts[i];
      ctx.globalAlpha = Math.max(0, p.t / p.T);
      ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // ---------- slice 2: starfield (seeded; pure presentation) ----------
  function initStars() {
    const r = mulberry32(hash32((SEED >>> 0) + 999));
    stars = [];
    for (let i = 0; i < 70; i++) {
      stars.push({ x: r() * W, y: r() * H, s: 0.6 + r() * 1.3, p: r() * 6.283, sp: 0.7 + r() * 1.8 });
    }
  }
  function drawStars() {
    for (let i = 0; i < stars.length; i++) {
      const st = stars[i];
      const tw = 0.42 + 0.26 * Math.sin(pt * st.sp + st.p);
      ctx.fillStyle = "rgba(190,205,255," + tw.toFixed(3) + ")";
      ctx.fillRect(st.x, st.y, st.s, st.s);
    }
  }
  const cellPos = (s, r, c) => ({ x: BX + (c + 0.5) * (BOARD / s.N), y: BY + (r + 0.5) * (BOARD / s.N) });

  // ---------- slice 3: DOM UI sync (cheap, change-detected, never in the game core) ----------
  let capCache = "", pipCache = -1, pipWarnCache = false;
  function buildPips() {
    pipsEl.innerHTML = "";
    for (let i = 0; i < budget; i++) {
      const p = document.createElement("span");
      p.className = "pip";
      pipsEl.appendChild(p);
    }
    pipCache = -1;
  }
  function syncDom() {
    // BOARD N caption, with the per-board best once one exists
    const bb = save.bestTurns[SEED + ":" + depth];
    const cap = "BOARD " + (depth + 1) + (bb ? "  ·  BEST " + bb + " TURNS" : "");
    if (cap !== capCache) { capCache = cap; boardCap.textContent = cap; }
    // budget pips
    const warn = turnsLeft <= 2;
    if (turnsLeft !== pipCache || warn !== pipWarnCache) {
      pipCache = turnsLeft; pipWarnCache = warn;
      const kids = pipsEl.children;
      for (let i = 0; i < kids.length; i++) {
        kids[i].className = "pip" + (i < turnsLeft ? (warn ? " on warn" : " on") : "");
      }
    }
    // the chevrons breathe on the music's strong line
    const ka = (0.42 + 0.30 * kickPulse).toFixed(3);
    chevL.style.opacity = ka; chevR.style.opacity = ka;
  }

  // ---------- render ----------
  const COL = {
    bg: "#05060f", frame: "#0b0e20", frameEdge: "#1b2145", dot: "rgba(255,255,255,.05)",
    stone: "#20264a", stoneEdge: "#333c74",
    wall: "#5a6bb0", wallEdge: "#a9bcff",
    ball: "#7ef2ff", drain: "#ffb347"
  };
  function rrect(x, y, w, h, r, fill, stroke, lw) {
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2; ctx.stroke(); }
  }
  const lerp = (a, b, t) => a + (b - a) * t;
  const easeOut = (t) => 1 - Math.pow(1 - t, 3);

  // phase 1 is a real quarter-turn ARC about the board centre, not a straight chord — a chord
  // makes the whole board read as sliding rather than turning. phase 2 drops straight down.
  function arcPoint(m, dir, from, u) {
    const dx = from.x - m, dy = from.y - m;
    const r = Math.sqrt(dx * dx + dy * dy);
    if (r < 1e-6) return { x: from.x, y: from.y };
    const a = Math.atan2(dy, dx) + (dir > 0 ? 1 : -1) * (Math.PI / 2) * u;
    return { x: m + r * Math.cos(a), y: m + r * Math.sin(a) };
  }
  function itemPos(it, t, N, dir) {
    if (t >= 1) return it.to;
    if (t < 0.5) return arcPoint(N / 2, dir, it.from, easeOut(t / 0.5));
    const u = easeOut((t - 0.5) / 0.5);
    return { x: lerp(it.mid.x, it.to.x, u), y: lerp(it.mid.y, it.to.y, u) };
  }

  function drawPiece(kind, px, py, k, scale, alpha) {
    ctx.globalAlpha = alpha;
    const half = k * 0.44 * scale;
    if (kind === "stone") {
      rrect(px - half, py - half, half * 2, half * 2, k * 0.16, COL.stone, COL.stoneEdge, 2);
    } else if (kind === "wall") {
      rrect(px - half, py - half, half * 2, half * 2, k * 0.18, COL.wall, null, 0);
      ctx.fillStyle = COL.wallEdge;
      rrect(px - half, py - half, half * 2, Math.max(2, k * 0.09), k * 0.05, COL.wallEdge, null, 0);
    } else if (kind === "ball") {
      const r = k * 0.30 * scale;
      const glow = 1 + 0.30 * notePulse;
      const g = ctx.createRadialGradient(px, py, 0, px, py, r * 2.4 * glow);
      g.addColorStop(0, "rgba(126,242,255,.95)"); g.addColorStop(0.35, "rgba(90,200,255,." + (45 + (notePulse * 40) | 0) + ")");
      g.addColorStop(1, "rgba(60,160,255,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(px, py, r * 2.4 * glow, 0, 7); ctx.fill();
      ctx.fillStyle = COL.ball; ctx.beginPath(); ctx.arc(px, py, r, 0, 7); ctx.fill();
    } else if (kind === "drain") {
      const r = k * 0.36 * scale;
      ctx.fillStyle = "#04040a"; ctx.beginPath(); ctx.arc(px, py, r, 0, 7); ctx.fill();
      ctx.strokeStyle = COL.drain; ctx.lineWidth = Math.max(2, k * 0.07);
      ctx.globalAlpha = alpha * (0.55 + 0.45 * Math.abs(Math.sin(tick * 0.05)));
      ctx.beginPath(); ctx.arc(px, py, r, 0, 7); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function render() {
    ctx.fillStyle = COL.bg; ctx.fillRect(0, 0, W, H);
    drawStars();
    if (!live) return;
    const N = live.N, k = BOARD / N;
    // screen shake: deterministic jitter from the clock, no RNG in the frame
    const sh = shakeT > 0 ? Math.sin(tick * 1.35) * shakeT * 24 : 0;
    ctx.save();
    if (sh) ctx.translate(sh, -sh * 0.6);
    rrect(BX - 7, BY - 7, BOARD + 14, BOARD + 14, 14, COL.frame, COL.frameEdge, 2);

    ctx.fillStyle = COL.dot;
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      ctx.beginPath(); ctx.arc(BX + (c + 0.5) * k, BY + (r + 0.5) * k, 1.4, 0, 7); ctx.fill();
    }

    const animating = animData && anim > 0;
    const t = animating ? 1 - Math.max(0, anim) / ANIM : 1;

    if (animating) {
      const items = animData.items;
      for (let i = 0; i < items.length; i++) {
        const it = items[i], p = itemPos(it, t, animData.N, animData.dir);
        const fade = it.gone ? Math.max(0, (t - 0.5) / 0.5) : 0;
        drawPiece(it.kind, BX + p.x * k, BY + p.y * k, k, 1 - 0.7 * fade, 1 - fade);
      }
    } else {
      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
        if (live.stone[r * N + c]) drawPiece("stone", BX + (c + 0.5) * k, BY + (r + 0.5) * k, k, 1, 1);
      }
      drawPiece("drain", BX + (live.drain.c + 0.5) * k, BY + (live.drain.r + 0.5) * k, k, 1, 1);
      for (let i = 0; i < live.walls.length; i++) {
        const w = live.walls[i];
        drawPiece("wall", BX + (w.c + 0.5) * k, BY + (w.r + 0.5) * k, k, 1, 1);
      }
      drawPiece("ball", BX + (live.ball.c + 0.5) * k, BY + (live.ball.r + 0.5) * k, k, 1, 1);
    }

    // the board-deal beat: a ring opens from the box
    if (dealT > 0) {
      const u = 1 - dealT / 0.28;
      ctx.strokeStyle = "rgba(126,242,255," + (0.45 * (1 - u)).toFixed(3) + ")";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(W / 2, BY + BOARD / 2, 24 + u * (BOARD / 2 + 16), 0, 7);
      ctx.stroke();
    }

    drawParts();

    // big flashes
    if (winT > 0) { ctx.fillStyle = "rgba(126,242,255," + (winT * 0.35).toFixed(3) + ")"; ctx.fillRect(0, 0, W, H); }
    if (deadT > 0) { ctx.fillStyle = "rgba(255,70,70," + (deadT * 0.40).toFixed(3) + ")"; ctx.fillRect(0, 0, W, H); }
    ctx.restore();

    if (state === "play") {
      elDepth.textContent = String(depth);
      elTurns.textContent = String(Math.max(0, turnsLeft));
      elBest.textContent = String(save.bestDepth);
      syncDom();   // caption, pips, chevrons — DOM, scaled by --s
    }
  }

  let acc = 0, last = performance.now();
  function frame(now) {
    const real = Math.min((now - last) / 1000, 0.05); last = now;
    if (anim > 0) { anim = Math.max(0, anim - real); if (anim === 0) resolvePending(); }
    if (flashT > 0) flashT = Math.max(0, flashT - real);
    if (winT > 0) winT = Math.max(0, winT - real);
    if (deadT > 0) deadT = Math.max(0, deadT - real);
    // slice 2: presentation clocks
    pt += real; runT += real;
    if (dealT > 0) dealT = Math.max(0, dealT - real);
    if (shakeT > 0) shakeT = Math.max(0, shakeT - real);
    if (kickPulse > 0) kickPulse = Math.max(0, kickPulse - real * 2.4);
    if (notePulse > 0) notePulse = Math.max(0, notePulse - real * 2.0);
    for (let i = 0; i < stars.length; i++) {
      const st = stars[i];
      st.y += real * st.s * 3.2;
      if (st.y > H) { st.y -= H + 2; st.x = (st.x + 37) % W; }
    }
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.t -= real;
      if (p.t <= 0) { parts.splice(i, 1); continue; }
      p.x += p.vx * real; p.y += p.vy * real; p.vx *= 0.96; p.vy *= 0.96;
    }
    // the tutorial card is the single teaching surface while it is up (7 s, fresh run):
    // hold the zone's own labels behind it so nothing stacks
    const tutOn = state === "play" && depth === 0 && runT < 7;
    tutorialEl.classList.toggle("hidden", !tutOn);
    tapEl.classList.toggle("hidden", state !== "play" || tutOn);
    acc += real;
    let n = 0;
    while (acc >= DT && n < 12) { for (let i = 0; i < SUB; i++) { /* sim is event-driven (a turn is atomic) */ } tick++; acc -= DT; n++; }
    render();
    requestAnimationFrame(frame);
  }

  // ---------- probe surface: the REAL objects, not the drawing ----------
  function sig(g) {
    const s = g.state, N = s.N, parts2 = [];
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (s.stone[r * N + c]) parts2.push("s" + r + "," + c);
    parts2.push("d" + s.drain.r + "," + s.drain.c);
    parts2.push("b" + s.ball.r + "," + s.ball.c);
    const ws = s.walls.map((w) => w.r + "," + w.c).sort().join(";");
    return N + "|" + parts2.join("|") + "|w" + ws + "|min" + g.minTurns + "|bud" + g.budget + "|fb" + (g.fallback ? 1 : 0);
  }
  window.__game = {
    debug: () => ({
      state, depth, turnsLeft, budget, minTurns, N: live ? live.N : 0, rot, seed: SEED, tick,
      anim, pending, walls: live ? live.walls.length : 0, attempts, fallback,
      ball: live ? { r: live.ball.r, c: live.ball.c } : null,
      drain: live ? { r: live.drain.r, c: live.drain.c } : null,
      boardBest: save.bestTurns[SEED + ":" + depth] ?? null, bestDepth: save.bestDepth, ticksPerSec: DT
    }),
    newRun, turn, setState,
    get seed() { return SEED; },
    get depth() { return depth; },
    get tick() { return tick; },
    get rot() { return rot; },
    _board: () => ({
      N: live.N, stone: Array.from(live.stone), drain: { r: live.drain.r, c: live.drain.c },
      ball: { r: live.ball.r, c: live.ball.c }, walls: live.walls.map((w) => ({ id: w.id, r: w.r, c: w.c }))
    }),
    _cellAt: (r, c) => {
      if (!live || r < 0 || r >= live.N || c < 0 || c >= live.N) return null;
      if (isStone(live, r, c)) return "stone";
      if (isDrain(live, r, c)) return "drain";
      if (isBall(live, r, c)) return "ball";
      if (wallAt(live, r, c)) return "wall";
      return "empty";
    },
    _counts: () => ({
      stone: live.stone.reduce((a, v) => a + v, 0), walls: live.walls.length,
      drain: isDrain(live, live.drain.r, live.drain.c) ? 1 : 0
    }),
    _gen: (d) => genBoard(d),
    _genSig: (d) => sig(genBoard(d)),
    _solve: (d) => {
      const g = genBoard(d), r = solveFrom(g.state, CAP);
      return r ? { turns: r.turns, path: r.path, minTurns: g.minTurns, budget: g.budget, N: g.state.N, attempts: g.attempts, fallback: g.fallback } : null;
    },
    _solveNow: (cap) => { const r = solveFrom(live, cap || CAP); return r ? { turns: r.turns, path: r.path } : null; },
    _clone: () => cloneState(live),
    _applyTurn: (st, dir) => applyTurn(st, dir),
    _rotState: (st, dir) => { rotState(st, dir); return st; },
    _wallsStep: (st) => wallsStep(st),
    _ballFall: (st) => ballFall(st),
    _freeCell: (st, r, c) => freeCell(st, r, c),
    _mk: (N, stone, drain, ball, walls) => ({
      N, stone: Uint8Array.from(stone), drain: { r: drain[0], c: drain[1] },
      ball: { r: ball[0], c: ball[1] },
      walls: walls.map((w, i) => ({ id: i + 1, r: w[0], c: w[1] })), nextId: walls.length + 1
    }),
    _pointer: (clientX) => onPointer(clientX),
    // slice 2: audio state + an offline render of the day's music (never played, just computed)
    _audioDesc: () => window.Minstrel ? window.Minstrel.describe(MUS_SEED) : null,
    _musicState: () => audio.music ? {
      playing: !!audio.music.playing, bars: audio.music.bars.length,
      notes: audio.music.notes, hasAc: !!AC, muted: audio.muted
    } : { playing: false, bars: 0, notes: 0, hasAc: !!AC, muted: audio.muted },
    _renderMusic: async function (bars) {
      if (!window.Minstrel) return { ok: false, why: "no engine" };
      if (typeof window.OfflineAudioContext === "undefined") return { ok: false, why: "no OfflineAudioContext" };
      bars = bars || 4;
      const octx = new window.OfflineAudioContext(2, (44100 * 16 * bars) | 0, 44100);
      const m = new window.Minstrel({ seed: MUS_SEED, tempo: 93 });
      m.ctx = octx;
      m.playing = true; m.bar = 0; m._phrase = null; m._padUntil = 0; m.bars = [];
      m._build();
      const barLen = (60 / m.tempo) * 4;
      for (let b = 0; b < bars; b++) { m._bar(b * barLen, barLen); m.bar++; }
      const buf = await octx.startRendering();
      const ch = buf.getChannelData(0);
      let peakSamples = 0; let sum = 0; let n = 0;
      for (let i = 0; i < ch.length; i += 37) { const v = Math.abs(ch[i]); sum += v; n++; if (v > 0.001) peakSamples++; }
      return { ok: true, seed: MUS_SEED, bars, samples: ch.length, peakSamples, mean: sum / n };
    }
  };

  initStars();
  seedTag.textContent = "SEED " + SEED;
  muteEl.textContent = audio.muted ? "♪ OFF" : "♪ ON";
  newRun();
  requestAnimationFrame(frame);
})();
</script>
</body>
